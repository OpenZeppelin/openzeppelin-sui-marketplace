name: Setup Sui CLI
description: Install Sui CLI (with caching) and add it to PATH.
runs:
  using: composite
  steps:
    - name: Cache Sui binary
      id: cache-sui
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/sui
        key: sui-${{ runner.os }}-${{ runner.arch }}-${{ env.SUI_CLI_VERSION }}

    - name: Install Sui CLI
      if: steps.cache-sui.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.local/bin
        tmp="$(mktemp -d)"
        curl -fL "https://github.com/MystenLabs/sui/releases/download/mainnet-v${{ env.SUI_CLI_VERSION }}/sui-mainnet-v${{ env.SUI_CLI_VERSION }}-ubuntu-x86_64.tgz" -o "$tmp/sui.tgz"
        # Extract only the `sui` binary so the other release tools don't litter the workspace.
        tar -xzf "$tmp/sui.tgz" -C "$tmp" sui
        install -m 0755 "$tmp/sui" ~/.local/bin/sui
        rm -rf "$tmp"
      shell: bash

    - name: Add Sui to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Verify Sui installation
      run: sui --version
      shell: bash
